<!DOCTYPE html>
<html dir="rtl" lang="ar" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="./dist/output.css" as="style">
    <link href="./dist/output.css" rel="stylesheet">

    <link rel="stylesheet" href="css/all.min.css" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="css/all.min.css">
    </noscript>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@100..900&display=swap" rel="stylesheet"
        media="print" onload="this.media='all'">
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@100..900&display=swap"
            rel="stylesheet">
    </noscript>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/script.js" defer></script>
    <script src="js/interface.js" defer></script>
    <script src="js/favorites.js" defer></script>
    <script src="js/done.js" defer></script>
    <script src="js/later.js" defer></script>
    <title>مشاهدة افلام انيميشن - الشامي</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#14b8a6">
    <meta name="description"
        content="مشاهدة أحدث أفلام ومسلسلات الأنمي مترجمة ومدبلجة بجودة عالية مجاناً وبدون إعلانات على موقع الشامي.">
    <link rel="canonical" href="https://elshami-movies.pages.dev/">

    <meta property="og:title" content="موقع مشاهدة انيميشن - الشامي">
    <meta property="og:description"
        content="مشاهدة أحدث أفلام ومسلسلات الأنمي مترجمة ومدبلجة بجودة عالية مجاناً وبدون إعلانات على موقع الشامي.">
    <meta property="og:locale" content="ar_AR">
    <!-- <meta property="og:image" content="https://elshami-movies.pages.dev/favicon.ico"> -->
    <meta property="og:url" content="https://elshami-movies.pages.dev/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="الشامى">
    <script type="application/ld+json">
        {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "الشامى",
        "url": "https://elshami-movies.pages.dev/"
        }
    </script>
</head>

<body class="font-noto bg-pri-bg text-pri-text scroll-smooth transition-all selection:bg-pri-item/40">

    <header
        class="fixed w-full flex justify-between px-10 h-16 items-center text-pri-text border-b-3 border-b-sec-bg/20 backdrop-blur-sm transition-colors z-49 overflow-clip gap-6">
        <!-- logo -->
        <a href="/">
            <img src="img/Alshami-logo-ar-white.png" alt="شعار موقع الشامي" class="w-20">
        </a>


        <!-- search -->
        <div class="flex gap-4 sm:w-100">
            <label for="searchBar" class="sr-only">ابحث في الموقع</label>
            <input type="search" id="searchBar" autocomplete="off" name="searchBar" aria-label="ابحث هنا"
                class="block w-full p-1 ps-9 outline-none border text-sm rounded-2xl focus:bg-sec-bg/10 focus:border-pri-item transition-colors"
                placeholder="ابحث هنا" />
            <button type="button" id="searchBtn" onclick="searchAndRenderMovies()" name="searchBtn" aria-label="بحث"
                class="cursor-pointer rounded-lg px-0.5 py-2 group">
                <i class="fas fa-search fa-xl text-sec-bg group-hover:text-pri-item transition-colors"></i>
            </button>
        </div>
    </header>

    <!-- main -->
    <main class="flex items-center w-full flex-col min-h-50 py-16">
        <nav class="h-16 w-full border-b-3 border-b-sec-bg/20 flex flex-row items-center px-10 justify-around">
            <!-- favourite -->
            <button type="button" id="favouriteBtn" name="favouritesBtn" onclick="fetchAndRenderFavorites()"
                aria-label="المفضلة"
                class="py-2 px-4 border border-red-500 focus:bg-red-200/20 bg-none rounded-full hover:cursor-pointer flex flex-row items-center">
                <span class="">المفضلة</span>
                <i class="fas fa-heart fa-xl text-red-500"></i>
            </button>
            <!-- later -->
            <button type="button" id="laterBtn" name="laterBtn" onclick="fetchAndRenderlaters()" aria-label="لاحقاً"
                class="py-2 px-4 border border-gray-500 focus:bg-gray-200/20 bg-none rounded-full hover:cursor-pointer flex flex-row items-center">
                <span class="">لاحقا</span>
                <i class="fas fa-clock fa-xl text-white"></i>
            </button>
            <!-- done -->
            <button type="button" id="doneBtn" name="doneBtn" onclick="fetchAndRenderdones()" aria-label="شاهدته"
                class="py-2 px-4 border border-green-500 focus:bg-green-200/20 bg-none rounded-full hover:cursor-pointer flex flex-row items-center">
                <span class="">شاهدته</span>
                <i class="fas fa-circle-check fa-xl text-green-500"></i>
            </button>
        </nav>
        <div id="searchBack" class="w-full justify-center items-center py-4 hidden">
            <button type="button" name="backBtn" id="backBtn" onclick="SearchBack()"
                class="cursor-pointer rounded-lg px-10 py-1 border bg-sec-bg/10 hover:border-pri-item transition-colors">
                رجوع
            </button>
        </div>
        <!-- movie section -->
        <div class="flex flex-row w-full">
            <section
                class="w-full flex-1 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 justify-center gap-8 px-8 py-16">

                <div class="card bg-gray-700 animate-pulse"></div>
                <div class="card bg-gray-700 animate-pulse"></div>
                <div class="card bg-gray-700 animate-pulse"></div>
                <div class="card bg-gray-700 animate-pulse"></div>
                <div class="card bg-gray-700 animate-pulse"></div>
                <div class="card bg-gray-700 animate-pulse"></div>
                <div class="card bg-gray-700 animate-pulse"></div>
                <div class="card bg-gray-700 animate-pulse"></div>
                <div class="card bg-gray-700 animate-pulse"></div>
                <div class="card bg-gray-700 animate-pulse"></div>
                <div class="card bg-gray-700 animate-pulse"></div>
                <div class="card bg-gray-700 animate-pulse"></div>

            </section>
        </div>
        <div id="pagination" class="w-full flex justify-center items-center gap-10">
            <button type="button" name="nextBtn" id="nextBtn" onclick="Next()"
                class="cursor-pointer rounded-lg px-0.5 py-2 group flex items-center">
                <i
                    class="fas fa-chevron-circle-right fa-xl text-sec-bg group-hover:text-pri-item transition-colors"></i>التالي
            </button>
            <button type="button" name="previousBtn" id="previousBtn" onclick="Previous()"
                class="cursor-pointer rounded-lg px-0.5 py-2 group flex items-center">
                السابق<i
                    class="fas fa-chevron-circle-left fa-xl text-sec-bg group-hover:text-pri-item transition-colors"></i>
            </button>
        </div>

        <!-- <button class="cursor-pointer bg-green-700 rounded-full p-2 font-bold mb-4 hover:bg-green-800" onclick="fetchAndRenderMovies()">click here</button> -->
    </main>
    <!-- end -->

    <template>
        <div id="" class="card relative z-0">

            <img src="" alt="غلاف الفيلم">

            <section class="">
                <button type="button" class="hover:cursor-pointer" aria-label="اضف كمفضل">
                    <span class="heart-outline">
                        <i class="far fa-heart fa-2xl"></i>
                    </span>
                    <span class="heart-solid">
                        <i class="fas fa-heart fa-2xl"></i>
                    </span>
                </button>
                <button type="button" class="hover:cursor-pointer" aria-label="اضف لمشاهدة لاحقاً">
                    <span class="later-outline">
                        <i class="far fa-plus fa-2xl fa-later"></i>
                    </span>
                    <span class="later-solid">
                        <i class="fas fa-clock fa-2xl fa-later"></i>
                    </span>
                </button>
                <button type="button" class="hover:cursor-pointer" aria-label="اضف كمشاهد">
                    <span class="done-outline">
                        <i class="far fa-circle-check fa-2xl fa-done"></i>
                    </span>
                    <span class="done-solid">
                        <i class="fas fa-circle-check fa-2xl fa-done"></i>
                    </span>
                </button>
            </section>
            <a href="" class="group block w-full h-auto">
                <div>
                    <h4 id="title" class="group-hover:-translate-y-10 transition-all duration-500"></h4>
                </div>
            </a>
        </div>
    </template>
</body>

</html>
