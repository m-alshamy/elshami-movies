<!DOCTYPE html>
<html dir="rtl" lang="ar" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="./dist/output.css" rel="stylesheet">
    <link rel="stylesheet" href="css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/script.js"></script>
    <script src="js/interface.js"></script>
    <script src="js/favorites.js"></script>
    <title>مشاهدة افلام انيميشن - الشامي</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta name="language" content="Arabic">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@100..900&display=swap" rel="stylesheet">
    <meta name="description" content="شاهد احدث افلام الانيميشن مجانا بدون اعلانات و بكل سهولة عبر موقعنا .">

    <!-- منع التكرار وتحديد الرابط الأصلي -->
    <link rel="canonical" href="https://elshami-movies.pages.dev/">

    <!-- وسوم Open Graph لوسائل التواصل الاجتماعي -->
    <meta property="og:title" content="موقع مشاهدة انيميشن - الشامي">
    <meta property="og:description" content="شاهد احدث افلام الانيميشن مجانا بدون اعلانات و بكل سهولة عبر موقعنا .">
    <meta property="og:image" content="https://elshami-movies.pages.dev/favicon.ico">
    <meta property="og:url" content="https://elshami-movies.pages.dev/">
    <meta property="og:type" content="website">
</head>

<body class="font-noto bg-pri-bg text-pri-text scroll-smooth transition-all selection:bg-pri-item/40">

    <header
        class="fixed w-full flex justify-between px-10 h-16 items-center text-pri-text border-b-3 border-b-sec-bg/20 backdrop-blur-sm transition-all z-49 overflow-clip gap-6">
        <!-- logo -->
        <!-- favourite -->
        <button type="button" id="favouriteBtn" onclick="fetchAndRenderFavorites()"
            class="py-2 px-4 border-red-500 bg-red-200/20 rounded-full hover:cursor-pointer flex flex-row items-center">
            <span class="">المفضلة</span>
            <i class="fas fa-heart fa-xl text-red-500"></i>
        </button>

        <!-- search -->
        <div class="flex gap-4 sm:w-100">
            <input type="search" id="searchBar" autocomplete="off"
                class="block w-full p-1 ps-9 outline-none border text-sm rounded-2xl focus:bg-sec-bg/10 focus:border-pri-item transition-all"
                placeholder="ابحث هنا" />
            <button type="button" id="searchBtn" onclick="searchAndRenderMovies()"
                class="cursor-pointer rounded-lg px-0.5 py-2 group">
                <i class="fas fa-search fa-xl text-sec-bg group-hover:text-pri-item transition-all"></i>
            </button>
        </div>
    </header>

    <!-- main -->
    <main class="flex items-center w-full flex-col min-h-50 py-16">
        <div id="searchBack" class="w-full justify-center items-center py-4 hidden">
            <button type="button" id="searchBtn" onclick="SearchBack()"
                class="cursor-pointer rounded-lg px-10 py-1 border bg-sec-bg/10 hover:border-pri-item">
                رجوع
            </button>
        </div>
        <!-- movie section -->
        <div class="flex flex-row w-full">
            <section
                class="w-full flex-1 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 justify-center gap-8 px-8 py-16">

                <p id="loadico" class="text-yellow-500 p-4 fixed text-center self-center place-self-center">
                    <i class="fas fa-spinner fa-pulse fa-xl text-sec-bg group-hover:text-pri-item transition-all"></i>
                </p>

            </section>
        </div>

        <div id="panigation" class="w-full flex justify-center items-center gap-10">
            <button type="button" id="nextBtn" onclick="Next()"
                class="cursor-pointer rounded-lg px-0.5 py-2 group flex items-center">
                <i
                    class="fas fa-chevron-circle-right fa-xl text-sec-bg group-hover:text-pri-item transition-all"></i>التالي
            </button>
            <button type="button" id="previousBtn" onclick="Previous()"
                class="cursor-pointer rounded-lg px-0.5 py-2 group flex items-center">
                السابق<i
                    class="fas fa-chevron-circle-left fa-xl text-sec-bg group-hover:text-pri-item transition-all"></i>
            </button>
        </div>

        <!-- <button class="cursor-pointer bg-green-700 rounded-full p-2 font-bold mb-4 hover:bg-green-800" onclick="fetchAndRenderMovies()">click here</button> -->
    </main>
    <!-- end -->

    <template>
        <div id="" class="card">
            <section class="">
                <button type="button" class="hover:cursor-pointer">
                    <span class="heart-outline">
                        <i class="far fa-heart fa-2xl"></i>
                    </span>
                    <span class="heart-solid">
                        <i class="fas fa-heart fa-2xl"></i>
                    </span>
                </button>
            </section>
            <a href="" class="group block w-full h-auto">
                <div>
                    <h4 id="title"></h4>
                </div>
            </a>
        </div>
    </template>
</body>

</html>
